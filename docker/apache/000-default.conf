<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted

        # Defesa em profundidade (espelha scaffold/htaccess-security-append.txt).
        <FilesMatch "(?i)^(.*\.(md|markdown|sh)|((README|CHANGELOG|COPYRIGHT|INSTALL|LICENSE|MAINTAINERS|PATCHES|UPDATE|UPGRADE)(\..*)?))$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "(?i)^/var/www/html/(?:.+/)?vendor(?:/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
