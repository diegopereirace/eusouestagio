custom_banners.cursos_autocomplete:
  path: '/api/cursos/autocomplete'
  defaults:
    _controller: '\Drupal\custom_banners\Controller\CursosAutocompleteController::autocomplete'
  requirements:
    _permission: 'access content'
  methods: [GET]

custom_banners.cidades_autocomplete:
  path: '/api/cidades/autocomplete'
  defaults:
    _controller: '\Drupal\custom_banners\Controller\CidadesAutocompleteController::autocomplete'
  requirements:
    _permission: 'access content'
  methods: [GET]
