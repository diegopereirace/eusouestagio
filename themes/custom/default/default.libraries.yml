fonts_poppins:
  version: VERSION
  css:
    # preprocess:false — agregação Drupal stripava url() relativos dos WOFF2.
    base:
      fonts/poppins.css: { weight: -100, preprocess: false }
fonts_inter:
  version: VERSION
  css:
    base:
      fonts/inter.css: { weight: -100, preprocess: false }
global-styling:
  version: VERSION
  js:
    dist/js/global.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
  css:
    component:
      dist/css/style.css: {}
bootstrap:
  js:
    /libraries/popper/popper.min.js: { weight: -19 }
    /libraries/bootstrap/js/bootstrap.min.js: { weight: -20 }
  css:
    component:
      /libraries/bootstrap/css/bootstrap.min.css: {}
  dependencies:
    - core/popperjs
fontawesome:
  css:
    component:
      /libraries/fontawesome/css/all.min.css: {}

