services:
  drupal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eusouestagio-drupal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # HTTP primeiro: Docker Desktop "Open with browser" abre http://localhost:PORT
      - "${DRUPAL_HTTP_PORT:-8082}:80"
    environment:
      DRUPAL_DB_HOST: postgres
      DRUPAL_DB_PORT: 5432
      DRUPAL_DB_NAME: ${POSTGRES_DB}
      DRUPAL_DB_USER: ${POSTGRES_USER}
      DRUPAL_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/apache/default-ssl.conf:/etc/apache2/sites-available/default-ssl.conf:ro
    working_dir: /var/www/html
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eusouestagio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
