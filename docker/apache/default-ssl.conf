<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/localhost.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted

        # Defesa em profundidade (espelha scaffold/htaccess-security-append.txt).
        <FilesMatch "(?i)^(.*\.(md|markdown|sh)|((README|CHANGELOG|COPYRIGHT|INSTALL|LICENSE|MAINTAINERS|PATCHES|UPDATE|UPGRADE)(\..*)?))$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "(?i)^/var/www/html/(?:.+/)?vendor(?:/|$)">
        Require all denied
    </DirectoryMatch>

    # Sem HSTS: o ambiente local canônico é HTTP. Produção usa HTTPS na VPS.
    ErrorLog ${APACHE_LOG_DIR}/error_ssl.log
    CustomLog ${APACHE_LOG_DIR}/access_ssl.log combined
</VirtualHost>
</IfModule>
