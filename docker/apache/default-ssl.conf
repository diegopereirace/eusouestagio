<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/localhost.key

    # Pedidos em texto puro (http://localhost:8082) batem nesta porta TLS e
    # geram 400. Em vez da página de erro, manda o cliente para HTTPS.
    ErrorDocument 400 "<!DOCTYPE html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta http-equiv=\"refresh\" content=\"0;url=https://localhost:8082/\"><title>Use HTTPS</title><script>location.replace('https://localhost:8082'+location.pathname+location.search+location.hash);</script></head><body>Redirecionando para <a href=\"https://localhost:8082/\">https://localhost:8082/</a></body></html>"

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog ${APACHE_LOG_DIR}/error_ssl.log
    CustomLog ${APACHE_LOG_DIR}/access_ssl.log combined
</VirtualHost>
</IfModule>
